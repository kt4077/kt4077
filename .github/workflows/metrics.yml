name: GitHub Metrics

# 定时生成统计数据 SVG 并提交到当前仓库，README 直接引用该文件，
# 不依赖任何第三方在线服务（解决 Vercel 公共实例不可达 / 限流问题）。
#
# 使用前准备：
#   1. GitHub → Settings → Developer settings → Personal access tokens → Tokens (classic)
#      生成 token，勾选 read:user、repo（公开统计可只勾 read:user + public_repo）
#   2. 在 kt4077/kt4077 仓库 → Settings → Secrets and variables → Actions
#      新建名为 METRICS_TOKEN 的 secret，值为上面的 token
#   3. 首次可手动触发：Actions → GitHub Metrics → Run workflow
#
# 说明：
#   - committer_branch 设为 main，生成的 metrics.svg 与 README 同分支，可用相对路径引用
#   - 若 main 分支有保护规则，请改为 committer_branch: metrics，并把 README 中的
#     引用改成 https://raw.githubusercontent.com/kt4077/kt4077/metrics/metrics.svg
#   - 没有 PAT 时也可临时用 secrets.GITHUB_TOKEN，但统计范围受限（不含私有仓库）

on:
  schedule:
    # 每天 UTC 19:00，即北京时间次日 03:00
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: kt4077
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Shanghai
          config_padding: 6%
          plugin_languages: yes
          plugin_languages_ignored: html, css, dockerfile, gitignore, license
          plugin_languages_limit: 8
          plugin_followup: yes
          plugin_lines: yes
          output_action: commit
          output_path: metrics.svg
          committer_branch: main
          committer_message: "chore: update github metrics [skip ci]"
